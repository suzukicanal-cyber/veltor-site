# Card previews: finds the vehicle on each new catalog photo and which way it faces,
# so the cropped preview always shows its front (data/focus.json). Runs after each catalog sync.
name: Photo focus

on:
  workflow_run:
    workflows: ["Sync catalog from Telegram"]
    types: [completed]
  workflow_dispatch:
    inputs:
      limit:
        description: "Сколько фото обработать (0 — все новые)"
        required: false
        default: "0"
      sheet:
        description: "Сохранить контрольный лист (yes/no)"
        required: false
        default: "no"

permissions:
  contents: write

concurrency:
  group: photo-focus
  cancel-in-progress: false

jobs:
  focus:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            yolov8s.pt
          key: focus-models-v1
      - name: Analyse new photos
        run: |
          pip install --quiet torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet ultralytics open_clip_torch pillow
          ARGS="--limit ${{ github.event.inputs.limit || '0' }}"
          if [ "${{ github.event.inputs.sheet }}" = "yes" ]; then ARGS="$ARGS --sheet focus-sheet.jpg"; fi
          python3 scripts/focus.py $ARGS
      - uses: actions/upload-artifact@v4
        if: ${{ github.event.inputs.sheet == 'yes' }}
        with:
          name: focus-sheet
          path: focus-sheet.jpg
      - name: Commit
        if: ${{ github.event.inputs.sheet != 'yes' }}
        run: |
          if [ -n "$(git status --porcelain data/focus.json)" ]; then
            git config user.name "veltor-bot"
            git config user.email "veltor-bot@users.noreply.github.com"
            git add data/focus.json
            git commit -m "Каталог: кадрирование превью по передней части техники"
            git pull --rebase -q origin main && git push
          fi
