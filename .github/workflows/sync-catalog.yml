# Каталог из Telegram: каждые 2 часа забирает новые посты и фото и коммитит их в репозиторий.
# Работает на серверах GitHub, потому что с российского сервера Telegram недоступен.
# Сервер сайта сам подтягивает эти изменения из GitHub и пересобирается.
name: Sync catalog from Telegram

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      from:
        description: "С какого номера сообщения искать (пусто — только новые)"
        required: false
        default: ""
      since:
        description: "Не раньше даты, ГГГГ-ММ-ДД (пусто — без ограничения)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: sync-catalog
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pull new posts and photos
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.from }}" ]; then ARGS="$ARGS --from ${{ github.event.inputs.from }}"; fi
          if [ -n "${{ github.event.inputs.since }}" ]; then ARGS="$ARGS --since ${{ github.event.inputs.since }}"; fi
          node scripts/sync-telegram.mjs $ARGS
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Neural x2 upscale of new photos (Real-ESRGAN, soft)
        run: |
          pip install --quiet numpy pillow
          python3 scripts/upscale.py --budget 2700
      - name: Commit catalog
        run: |
          if [ -n "$(git status --porcelain data public/catalog)" ]; then
            git config user.name "veltor-bot"
            git config user.email "veltor-bot@users.noreply.github.com"
            git add data public/catalog
            git commit -m "Каталог: новые подборы и обработанные фото"
            git pull --rebase -q origin main && git push
          else
            echo "Новых постов нет"
          fi
