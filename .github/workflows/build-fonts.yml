# Once (or after the font changes): static Unbounded without overlapping contours for outlined words.
name: Build outline font
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install --quiet fonttools skia-pathops brotli
          python3 scripts/make_outline_font.py
      - run: |
          git config user.name "veltor-bot"
          git config user.email "veltor-bot@users.noreply.github.com"
          git add public/fonts
          git diff --cached --quiet || git commit -m "Шрифт для контурных надписей без стыков"
          git pull --rebase -q origin main && git push
