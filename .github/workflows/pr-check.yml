# Builds every pull request (e.g. the weekly article from the content agent) before it can reach the server.
name: PR check

on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: node scripts/check-articles.mjs
      - run: npm run build
