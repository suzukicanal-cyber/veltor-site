server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;
    gzip_min_length 1024;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # страницы всегда проверяются заново, чтобы новые объявления были видны сразу
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri $uri/ $uri.html =404;
    }

    # товарный фид для Яндекса
    location = /feed.yml {
        default_type application/xml;
        charset utf-8;
        add_header Cache-Control "no-cache" always;
    }

    # фото каталога, команды, ролики
    location ~* \.(jpg|jpeg|png|webp|svg|mp4)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
    }
    error_page 404 /404.html;
}
