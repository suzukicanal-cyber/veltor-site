# /etc/nginx/sites-available/veltor — статический сайт VELTOR (папка out/ после next build)
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;

    root /var/www/veltor;
    index index.html;
    charset utf-8;

    # www → без www
    if ($host = www.__DOMAIN__) { return 301 $scheme://__DOMAIN__$request_uri; }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # файлы сборки с хешем в имени — кэш на год
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # фото каталога, команды, ролики
    location ~* ^/(catalog/\d+|team|media|feed)/.+\.(jpg|jpeg|png|webp|mp4)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    error_page 404 /404.html;
}
