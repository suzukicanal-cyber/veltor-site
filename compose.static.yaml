# Сайт отдаёт обычный nginx без сборки своего образа: готовые файлы лежат в /opt/veltor/www/html
# и собираются скриптом deploy/update-docker.sh одноразовым контейнером node (без docker build).
services:
  web:
    build: !reset null
    image: nginx:stable-alpine
    volumes:
      - ./www/html:/usr/share/nginx/html:ro
      - ./deploy/docker-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
