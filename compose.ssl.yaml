services:
  web:
    ports: !reset []
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    # папка, а не один файл: git заменяет Caddyfile новым файлом, и привязка одного файла
    # продолжала бы показывать контейнеру старую версию (reload не видел изменений)
    command: caddy run --config /etc/caddy-conf/Caddyfile --adapter caddyfile
    volumes:
      - ./deploy:/etc/caddy-conf:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  caddy_data:
  caddy_config:
